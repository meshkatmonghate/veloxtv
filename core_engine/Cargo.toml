[package]
name = "veloxtv_core"
version = "0.1.0"
edition = "2021"
authors = ["VeloxTV Team"]
description = "High-performance IPTV core engine for VeloxTV (Xtream Codes API, M3U Parser, Stream Recorder, Security)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
url = "2.4"

[lib]
crate-type = ["cdylib", "rlib"]
