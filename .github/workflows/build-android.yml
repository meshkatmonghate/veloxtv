name: Build Android TV & Mobile APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          cat android/local.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Stage Release APK
        run: |
          mkdir -p release_apk/
          echo "Searching for built APKs:"
          find build/ -name "*.apk" -ls || true
          APK_FILE=$(find build/ -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/ -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            echo "Selected APK: $APK_FILE"
            cp "$APK_FILE" release_apk/VeloxTV-Android.apk
            ls -lh release_apk/
          else
            echo "No APK found in build directory!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloxTV-Android-Release
          path: release_apk/VeloxTV-Android.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: release_apk/VeloxTV-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
